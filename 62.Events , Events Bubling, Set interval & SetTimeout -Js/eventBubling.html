<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubling</title>
    <style>
        .child{
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
            background-color: rgb(101, 163, 210);
        }
        .childContainer{
              border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
            background-color:beige;
        }
        .container{
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
            background-color :rgb(248, 250, 236);
        

        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childContainer">
        <div class="child">
            I am child
       </section>
        </div>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", (e)=>{
            e.stopPropagation()
            alert("Child was clicked")
            
        }) 
    document.querySelector(".childContainer").addEventListener("click", (e)=>{
        e.stopPropagation()
       alert("ChildContainer was clicked")
    })
    document.querySelector(".container").addEventListener("click", (e)=>{
     alert("Container was clicked")
    })
    console.log("index.js initializing")

}

    </script>
    
</body>
</html>
