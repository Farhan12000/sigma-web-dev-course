        .card {

            margin: 5px;
        }

        .text {
            font-size: 12px;
        }

        .image {
    
            position: relative;
        }

        .text h1,
        p {

        }

            z-index: 10;

            background: grey;
            opacity: 0.9;
            color: white;
            border-radius: 3px;
            font-size: 14px;
            padding: 3px;

        }
    </style>
