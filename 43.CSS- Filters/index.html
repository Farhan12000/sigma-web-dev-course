<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Filters</title>
    <style>
        /*img{
            filter: blur(10px);
          
        }*/
        .img1{
            width: 350px;
            height: 350px;
            filter: sepia(100%);
            
        }
        .srk{
           /* filter: grayscale(100%)*/
           /* filter: brightness(122%) ;*/
          /* filter: hue-rotate(50deg);*/
          filter: opacity(.51);

        }
        .img2{
           filter: contrast(1.5);

        }


    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://images.unsplash.com/photo-1784558473587-0d6ef848ffbe?q=80&w=1073&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
        <img class="srk" src="https://w0.peakpx.com/wallpaper/518/289/HD-wallpaper-shahrukh-khan-srk-smile-srk-smile-thumbnail.jpg" alt=" ">
        <img class="img2" src="https://i.pinimg.com/736x/e7/d3/22/e7d3227bd9c5ebe40ac7dc47c81e2496.jpg" alt="">


    </div>
    
</body>
</html>
